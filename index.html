<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Oxford International School: 1-sinf va 5–11-sinflarga qabul arizasi. O'zbek va rus tilida ta'lim.">
<meta property="og:title" content="Oxford International School — qabulga ariza">
<meta property="og:description" content="1-sinf va 5–11-sinflarga qabul. Arizani 5 bosqichda to'ldiring.">
<meta name="theme-color" content="#1b2141">
<link rel="icon" type="image/png" href="logo.png">
<title>Qabulga ariza | Oxford International School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: top bar, centered intro, one application card (school photo banner, progress strip, one step at a time). Light theme by design. */
  :root {
    --bg: #eef1f8;
    --surface: #ffffff;
    --soft: #f5f7fc;
    --ink: #141a33;
    --muted: #5f6888;
    --faint: #98a0bb;
    --line: #dfe4ef;
    --navy: #1b2141;
    --blue: #2a4cd0;
    --blue-2: #3c6ef2;
    --blue-soft: #eaf0ff;
    --gold-bg: #fcefc2;
    --gold-ink: #7a5710;
    --ok: #14935f;
    --ok-bg: #e3f5ec;
    --err: #c62828;
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink);
    background: radial-gradient(1200px 520px at 50% -10%, #ffffff 0%, transparent 70%), var(--bg);
    min-height: 100vh;
  }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Top bar */
  .top { background: rgba(255,255,255,.92); border-top: 4px solid var(--navy); border-bottom: 1px solid var(--line); }
  .top-in {
    max-width: 1080px; margin: 0 auto; padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .mark {
    width: 48px; height: 48px; border-radius: 12px; background: #fff; border: 1px solid var(--line);
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(27,33,65,.12); flex: none;
  }
  .brand .mark img { width: 34px; height: auto; }
  /* Dumaloq (pill) burchaklar */
  .langs, .langs button, .call, .btn { border-radius: 999px !important; }
  /* Logo: oq qutisiz, shaffof PNG */
  .brand .mark { background: transparent; border: 0; box-shadow: none; border-radius: 0; }
  .brand .mark img { width: 40px; filter: drop-shadow(0 2px 4px rgba(27,33,65,.18)); }
  .brand b { display: block; font-size: 1.05rem; font-weight: 800; letter-spacing: .01em; color: var(--navy); line-height: 1.2; }
  .brand small { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
  .langs button {
    font: inherit; font-size: .78rem; font-weight: 600; color: var(--muted); background: transparent; border: 0;
    padding: 6px 10px; border-radius: 9px; cursor: pointer; display: flex; gap: 6px; align-items: center;
  }
  .langs button b { font-weight: 800; color: var(--ink); }
  .langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(20,26,51,.12); }
  .call {
    display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--blue);
    background: var(--blue-soft); border: 1px solid #cdd9fb; border-radius: 12px; padding: 8px 14px;
    font-size: .82rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* Intro */
  main {
    max-width: 780px; margin: 0 auto; padding-block: 30px 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 26px;
  }
  .intro { text-align: center; display: grid; justify-items: center; gap: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; background: var(--gold-bg); color: var(--gold-ink);
    font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; border: 1px solid #f3dc8f;
  }
  .badge svg.i { width: 14px; height: 14px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4.6vw, 2.4rem); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; color: var(--ink); }
  h1 em { font-style: normal; color: var(--blue); }
  .lead { margin: 0; color: var(--muted); max-width: 54ch; font-weight: 500; }

  /* Card */
  .card { background: var(--surface); border-radius: 24px; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(27,33,65,.12); }
  .hero {
    position: relative; min-height: 280px; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px 26px; color: #fff; overflow: hidden; border-radius: 23px 23px 0 0;
    background: linear-gradient(135deg, #1b2141 0%, #22306b 60%, #2a3f8f 100%);
    background-size: cover; background-position: center 68%;
  }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,32,.05) 25%, rgba(10,14,32,.35) 55%, rgba(10,14,32,.85) 100%); }
  .hero > * { position: relative; z-index: 1; }
  .open-chip {
    position: absolute; top: 16px; left: 18px; display: inline-flex; align-items: center; gap: 7px;
    background: #fff; color: var(--ink); font-size: .74rem; font-weight: 700; padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .open-chip i { width: 8px; height: 8px; border-radius: 50%; background: #22c07a; box-shadow: 0 0 0 3px rgba(34,192,122,.22); }
  .hero-crest {
    position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.96); color: var(--navy); border-radius: 12px; padding: 6px 12px 6px 6px;
    font-size: .72rem; font-weight: 800; letter-spacing: .08em; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .hero-crest img { width: 26px; height: auto; }
  /* Logo: oq qutisiz, shaffof PNG holatida */
  .hero-crest { background: transparent; box-shadow: none; padding: 0; color: #fff; gap: 10px; font-size: .8rem; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .hero-crest img { width: 44px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.45)); }
  .hero h2 { margin: 0 0 10px; font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .76rem; font-weight: 600; }
  .hero .meta > span { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); padding: 5px 11px; border-radius: 999px; }
  .hero .meta svg.i { width: 14px; height: 14px; }

  .progress { background: var(--soft); border-bottom: 1px solid var(--line); padding: 16px 28px 18px; display: grid; gap: 12px; }
  .prow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill-step {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid #cdd9fb; background: var(--blue-soft); color: var(--blue);
    font-size: .72rem; font-weight: 800; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .pill-step svg.i { width: 14px; height: 14px; }
  .ptitle { font-weight: 700; font-size: .92rem; }
  .pct { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; background: var(--ok-bg); color: var(--ok); font-size: .76rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .pct svg.i { width: 13px; height: 13px; }
  .bar { height: 7px; border-radius: 99px; background: #e2e6f0; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 20%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), #1a9a8a); transition: width .35s ease; }

  form { padding: 28px; display: grid; gap: 24px; }
  .step { display: grid; gap: 22px; animation: rise .3s ease; }
  @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .shead { display: flex; gap: 14px; align-items: flex-start; }
  .sicon { width: 48px; height: 48px; border-radius: 14px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
  .sicon svg.i { width: 22px; height: 22px; }
  .shead h3 { margin: 0; font-size: 1.22rem; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .shead p { margin: 4px 0 0; color: var(--muted); font-size: .86rem; }

  .fields { display: grid; gap: 16px; }
  .two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 8px; min-width: 0; }
  .lrow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .lrow label, .lrow .lbl { font-weight: 700; font-size: .88rem; }
  .lrow small { color: var(--muted); font-size: .74rem; }
  .req { color: var(--err); margin-left: 3px; }
  .ctl { position: relative; display: flex; align-items: center; }
  .ctl > svg.i { position: absolute; left: 15px; color: var(--blue); pointer-events: none; }
  input[type="text"], input[type="tel"] {
    width: 100%; font: inherit; font-weight: 500; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px 13px 44px; min-height: 54px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(42,76,208,.14); }
  .field.bad input, .field.bad .dd-btn, .field.bad .tiles { border-color: var(--err); }
  .tel { display: flex; }
  .tel .cc {
    display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--line); border-right: 0;
    border-radius: 14px 0 0 14px; background: var(--soft); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .flag { display: grid; grid-template-rows: 1fr 1fr 1fr; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .flag.sm { width: 22px; height: 15px; border-radius: 3px; }
  .flag.lg { width: 44px; height: 32px; border-radius: 7px; }
  .flag-uz i:nth-child(1) { background: #1eb2d6; } .flag-uz i:nth-child(2) { background: #fff; border-block: 1px solid #ce1126; } .flag-uz i:nth-child(3) { background: #1eb53a; }
  .flag-ru i:nth-child(1) { background: #fff; } .flag-ru i:nth-child(2) { background: #0039a6; } .flag-ru i:nth-child(3) { background: #d52b1e; }
  .tel input { border-radius: 0 14px 14px 0; padding-left: 14px; font-variant-numeric: tabular-nums; letter-spacing: .04em; min-width: 0; font-size: 1.02rem; }
  .err { color: var(--err); font-size: .8rem; font-weight: 600; margin: 0; }

  /* Custom dropdown */
  .dd { position: relative; }
  .dd-btn {
    width: 100%; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 16px 10px 10px;
    font: inherit; color: var(--ink); text-align: left; background: var(--surface); cursor: pointer;
    border: 1px solid var(--line); border-radius: 16px; transition: border-color .15s, box-shadow .15s;
  }
  .dd-btn:hover { border-color: #c4cce0; }
  .dd.open .dd-btn, .dd-btn:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(42,76,208,.14); }
  .dd-val { flex: 1; min-width: 0; display: grid; line-height: 1.3; }
  .dd-val b { font-weight: 700; font-size: .96rem; }
  .dd-val small { font-size: .76rem; color: var(--muted); font-weight: 500; }
  .dd-val.ph b { color: var(--faint); font-weight: 600; }
  .dd-btn .chev { color: var(--muted); transition: transform .2s; }
  .dd.open .dd-btn .chev { transform: rotate(180deg); color: var(--blue); }
  .dd-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 30; margin: 0; padding: 6px; list-style: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 28px 56px rgba(20,26,51,.20), 0 2px 6px rgba(20,26,51,.06);
    max-height: min(480px, 70vh); overflow-y: auto; overscroll-behavior: contain;
    animation: pop .14s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  .dd-list:focus { outline: none; }
  .dd-group { padding: 10px 10px 4px; font-size: .67rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .dd-group:first-child { padding-top: 6px; }
  .dd-opt { display: flex; align-items: center; gap: 12px; padding: 7px 10px 7px 7px; border-radius: 12px; cursor: pointer; }
  .dd-opt + .dd-opt { margin-top: 2px; }
  .dd-opt.active { background: var(--soft); }
  .dd-opt[aria-selected="true"] { background: var(--blue-soft); }
  .dd-opt .t { flex: 1; min-width: 0; display: grid; line-height: 1.3; }
  .dd-opt .t b { font-weight: 700; font-size: .93rem; }
  .dd-opt .t small { font-size: .75rem; color: var(--muted); }
  .dd-opt .tick { color: var(--blue); opacity: 0; }
  .dd-opt[aria-selected="true"] .tick { opacity: 1; }

  /* Option icons */
  .oi { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; color: #fff; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .oi svg.i { width: 20px; height: 20px; }
  .oi.ph { background: var(--soft); color: var(--blue); border: 1px dashed #c9d2ea; }
  .oi.g-p { background: linear-gradient(135deg, #34c38f, #0f9d6b); }
  .oi.g-m { background: linear-gradient(135deg, #4f7cf7, #2a4cd0); }
  .oi.g-h { background: linear-gradient(135deg, #2b3566, #1b2141); color: #f3d38a; }
  .oi.s-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 95%); }
  .oi.s-tg { background: linear-gradient(135deg, #37bbfe, #1e96d4); }
  .oi.s-fb { background: #1877f2; }
  .oi.s-fr { background: linear-gradient(135deg, #34c38f, #0f9d6b); }
  .oi.s-bn { background: linear-gradient(135deg, #ffb547, #f08c00); }
  .oi.s-ol { background: linear-gradient(135deg, #a07cf8, #7048e8); }
  .oi.s-sc { background: linear-gradient(135deg, #2b3566, #1b2141); }
  .oi.s-ot { background: linear-gradient(135deg, #8d97b5, #5f6888); }

  .tiles { display: grid; gap: 12px; border: 1px solid transparent; border-radius: 16px; grid-template-columns: 1fr 1fr; }
  .tile { position: relative; }
  .tile input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .tile .box {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 16px;
    background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; height: 100%;
  }
  .tile .box:hover { border-color: #c4cce0; }
  .tile .txt { display: grid; min-width: 0; }
  .tile .txt b { font-weight: 700; font-size: .98rem; }
  .tile .txt small { color: var(--muted); font-size: .76rem; }
  .tile .dot { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c3c9da; flex: none; display: grid; place-items: center; }
  .tile input:checked + .box { border-color: var(--blue); background: #f5f8ff; box-shadow: 0 8px 20px rgba(42,76,208,.10); }
  .tile input:checked + .box .dot { border-color: var(--blue); background: var(--blue); }
  .tile input:checked + .box .dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
  .tile input:focus-visible + .box { box-shadow: 0 0 0 4px rgba(42,76,208,.14); }
  @media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } }

  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 22px; border-top: 1px solid var(--line); }
  .btn { font: inherit; font-weight: 700; font-size: .92rem; border-radius: 12px; padding: 13px 22px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--soft); }
  .btn-main { margin-left: auto; color: #fff; border: 0; background: linear-gradient(90deg, var(--navy), var(--blue) 60%, var(--blue-2)); box-shadow: 0 10px 22px rgba(42,76,208,.28); }
  .btn-main:hover { filter: brightness(1.07); }
  .btn:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
  .btn[disabled] { opacity: .65; cursor: progress; }
  .server-err { background: #fdecec; color: var(--err); padding: 10px 14px; border-radius: 10px; font-size: .85rem; font-weight: 600; margin: 0; }

  .done { padding: 40px 28px 32px; display: grid; justify-items: center; text-align: center; gap: 12px; }
  .done .ok { width: 68px; height: 68px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; }
  .done .ok svg.i { width: 34px; height: 34px; stroke-width: 2.6; }
  .done h3 { margin: 4px 0 0; font-size: 1.45rem; font-weight: 800; text-wrap: balance; }
  .done p { margin: 0; color: var(--muted); max-width: 46ch; }
  .sum { width: 100%; max-width: 440px; margin: 8px 0; padding: 4px 18px; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; text-align: left; }
  .sum div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
  .sum div:last-child { border-bottom: 0; }
  .sum dt { color: var(--muted); }
  .sum dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .phones a { color: inherit; text-decoration: none; white-space: nowrap; }
  .phones { font-weight: 700; color: var(--ink) !important; font-variant-numeric: tabular-nums; }

  footer { text-align: center; color: var(--muted); font-size: .78rem; }

  @media (max-width: 640px) {
    .langs button span { display: none; }
    .hero { min-height: 240px; padding: 18px; }
    .hero-crest span { display: none; }
    .hero-crest img { width: 40px; }
    .hero h2 { font-size: 1.3rem; }
    .progress, form { padding-left: 18px; padding-right: 18px; }
    .pct { margin-left: 0; }
    .btn { padding: 12px 16px; }
    #back span { display: none; }

    /* Telefonda: forma birinchi, ma'lumot pastda */
    .top-in { padding-block: 8px; flex-wrap: nowrap; gap: 8px; }
    .brand { gap: 8px; }
    .brand .mark { width: 38px; height: 38px; border-radius: 10px; }
    .brand .mark img { width: 34px; }
    .brand b { font-size: .8rem; }
    .brand small { display: none; }
    .top-r { flex-wrap: nowrap; gap: 6px; }
    .langs button { padding: 5px 7px; }
    .call { padding: 8px 10px; gap: 0; }
    .call > span, .call { font-size: 0; }
    .call svg.i { width: 18px; height: 18px; }
    main { padding-block: 14px 30px; gap: 18px; }
    main > .card { order: 1; }
    main > .intro { display: none; }
    main > footer { order: 3; }
    .hero { min-height: 0; padding: 64px 18px 14px; background-position: center 55%; }
    .hero .meta { display: none; }
    .open-chip { display: none; }
    .hero-crest { display: none !important; }
    /* Bosqich sarlavhasi: bir qatorda, dumaloq ikonka */
    .shead { display: grid; grid-template-columns: 38px 1fr; align-items: center; column-gap: 12px; }
    .shead > div:last-child { display: contents; }
    .sicon { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1px #cdd9fb; }
    .sicon svg.i { width: 18px; height: 18px; }
    .shead h3 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; line-height: 1.25; }
    .shead p { display: none; }
    .step { gap: 18px; }
    .hero h2 { margin: 0; }
    .progress { padding-top: 0; padding-bottom: 0; border-bottom: 0; background: transparent; }
    .prow { display: none; }
    .bar { height: 5px; border-radius: 0; margin: 0 -18px; }
    form { padding-top: 20px; padding-bottom: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

</head>

<main>
  <div class="intro">
    <span class="badge"><svg class="i"><use href="#i-cap"/></svg><span data-t="badge"></span></span>
    <h1 id="h1"></h1>
    <p class="lead" data-t="lead"></p>
  </div>

  <section class="card">
    <div class="hero" id="hero">
      <span class="open-chip"><i></i><span data-t="open"></span></span>
      <span class="hero-crest"><img src="logo.png" alt=""><span>OXFORD</span></span>
      <h2 data-t="heroTitle"></h2>
      <div class="meta">
        <span><svg class="i"><use href="#i-cal"/></svg><span data-t="chip1"></span></span>
        <span><svg class="i"><use href="#i-clock"/></svg><span data-t="chip2"></span></span>
      </div>
    </div>

    <div id="flow">
      <div class="progress">
        <div class="prow">
          <span class="pill-step"><svg class="i"><use href="#i-clock"/></svg><span id="stepOf"></span></span>
          <span class="ptitle" id="ptitle"></span>
          <span class="pct"><svg class="i"><use href="#i-check"/></svg><span id="pct"></span></span>
        </div>
        <div class="bar"><span id="bar"></span></div>
      </div>

      <form id="f" novalidate>
        <!-- 1. Ism, familiya -->
        <div class="step" data-step="1">
          <div class="shead"><div class="sicon"><svg class="i"><use href="#i-user"/></svg></div>
            <div><h3 data-t="q1"></h3><p data-t="h1t"></p></div></div>
          <div class="fields two">
            <div class="field" data-f="ism">
              <div class="lrow"><label for="ism"><span data-t="fn"></span><span class="req">*</span></label></div>
              <div class="ctl"><svg class="i"><use href="#i-user"/></svg><input type="text" id="ism" autocomplete="given-name" data-ph="fnPh"></div>
              <p class="err" data-t="eName" hidden></p>
            </div>
            <div class="field" data-f="familiya">
              <div class="lrow"><label for="familiya"><span data-t="ln"></span><span class="req">*</span></label></div>
              <div class="ctl"><svg class="i"><use href="#i-user"/></svg><input type="text" id="familiya" autocomplete="family-name" data-ph="lnPh"></div>
              <p class="err" data-t="eName" hidden></p>
            </div>
          </div>
        </div>

        <!-- 2. Sinf -->
        <div class="step" data-step="2" hidden>
          <div class="shead"><div class="sicon"><svg class="i"><use href="#i-book"/></svg></div>
            <div><h3 data-t="q2"></h3><p data-t="h2"></p></div></div>
          <div class="field" data-f="sinf">
            <div class="lrow"><span class="lbl" id="sinf-lbl"><span data-t="gradeLbl"></span><span class="req">*</span></span><small data-t="gradeHint"></small></div>
            <div class="dd" id="dd-sinf"></div>
            <p class="err" data-t="eGrade" hidden></p>
          </div>
        </div>

        <!-- 3. Til -->
        <div class="step" data-step="3" hidden>
          <div class="shead"><div class="sicon"><svg class="i"><use href="#i-lang"/></svg></div>
            <div><h3 data-t="q3"></h3><p data-t="h3"></p></div></div>
          <div class="field" data-f="til">
            <div class="lrow"><span class="lbl"><span data-t="langLbl"></span><span class="req">*</span></span></div>
            <div class="tiles" role="radiogroup">
              <label class="tile"><input type="radio" name="til" id="til-uz" value="O'zbek"><span class="box"><span class="flag lg flag-uz"><i></i><i></i><i></i></span><span class="txt"><b data-t="uzT"></b><small>O'zbek tilida</small></span><span class="dot"></span></span></label>
              <label class="tile"><input type="radio" name="til" id="til-ru" value="Rus"><span class="box"><span class="flag lg flag-ru"><i></i><i></i><i></i></span><span class="txt"><b data-t="ruT"></b><small>На русском языке</small></span><span class="dot"></span></span></label>
            </div>
            <p class="err" data-t="eLang" hidden></p>
          </div>
        </div>

        <!-- 4. Telefon -->
        <div class="step" data-step="4" hidden>
          <div class="shead"><div class="sicon"><svg class="i"><use href="#i-phone"/></svg></div>
            <div><h3 data-t="q4"></h3><p data-t="h4"></p></div></div>
          <div class="field" data-f="telefon">
            <div class="lrow"><label for="telefon"><span data-t="phoneLbl"></span><span class="req">*</span></label><small data-t="phoneHint"></small></div>
            <div class="tel"><span class="cc"><span class="flag sm flag-uz"><i></i><i></i><i></i></span>+998</span><input type="tel" id="telefon" inputmode="numeric" autocomplete="tel-national" placeholder="90 123 45 67"></div>
            <p class="err" data-t="ePhone" hidden></p>
          </div>
        </div>

        <!-- 5. Manba -->
        <div class="step" data-step="5" hidden>
          <div class="shead"><div class="sicon"><svg class="i"><use href="#i-mega"/></svg></div>
            <div><h3 data-t="q5"></h3><p data-t="h5"></p></div></div>
          <div class="field" data-f="manba">
            <div class="lrow"><span class="lbl" id="manba-lbl"><span data-t="srcLbl"></span><span class="req">*</span></span></div>
            <div class="dd" id="dd-manba"></div>
            <div class="ctl" id="otherWrap" hidden><svg class="i"><use href="#i-pen"/></svg><input type="text" id="other" data-ph="otherPh"></div>
            <p class="err" data-t="eSrc" hidden></p>
          </div>
        </div>

        <input type="text" id="hp" name="ois_hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
        <p class="server-err" id="serverErr" hidden></p>

        <div class="nav">
          <button type="button" class="btn btn-ghost" id="back"><svg class="i"><use href="#i-left"/></svg><span data-t="back"></span></button>
          <button type="submit" class="btn btn-main" id="next"><span id="nextTxt"></span><svg class="i" id="nextIco"><use href="#i-right"/></svg></button>
        </div>
      </form>
    </div>

    <div class="done" id="done" hidden>
      <div class="ok"><svg class="i"><use href="#i-check"/></svg></div>
      <h3 data-t="doneT"></h3>
      <p data-t="doneP"></p>
      <p class="server-err" id="demoNote" hidden>Bu faqat namuna sahifa: ariza Google Sheets'ga saqlanmadi. Haqiqiy sahifa Apps Script havolasida yoki saytingizda ishlaydi.</p>
      <dl class="sum" id="sum"></dl>
      <p data-t="qs"></p>
      <p class="phones"><a href="tel:+998933398393">+998 (93) 339-83-93</a> · <a href="tel:+998787070880">+998 (78) 707-08-80</a></p>
      <button type="button" class="btn btn-ghost" id="again"><span data-t="again"></span></button>
    </div>
  </section>

  <footer>© Oxford International School · <span data-t="brandSub"></span></footer>
</main>

      eName: 'Enter at least 2 letters', eGrade: 'Choose a grade', eLang: 'Choose a language', ePhone: 'Enter 9 digits, e.g. 90 123 45 67', eSrc: 'Choose or type an answer',
      eServer: 'The application was not sent. Check your connection and try again.',
      doneT: 'Thank you! Your application has been received', doneP: 'The admissions office will contact you soon.',
      sName: 'Student', sGrade: 'Grade', sLang: 'Language', sPhone: 'Phone', qs: 'Questions:', again: 'New application'
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var form = $('f'), phone = $('telefon'), other = $('other');
  var lang = 'uz', step = 1, sending = false;
  var state = { sinf: '', manba: '' };
  try { var saved = localStorage.getItem('ois-lang'); if (T[saved]) lang = saved; } catch (e) {}

  if (HERO_PHOTO && HERO_PHOTO.indexOf('__') !== 0) $('hero').style.backgroundImage = 'url("' + HERO_PHOTO + '")';

  function t(k) { return T[lang][k]; }
  function svg(id, cls) { return '<svg class="i ' + (cls || '') + '"><use href="#i-' + id + '"/></svg>'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- Ikonkali dropdown ----------
  var dropdowns = [];
  function closeAll(except) { dropdowns.forEach(function (d) { if (d !== except && d.isOpen()) d.close(true); }); }

  function Dropdown(root, opts) {
    var self = this;
    this.root = root; this.opts = opts; this.active = -1;
    root.innerHTML =
      '<button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="' + opts.labelId + '"></button>' +
      '<ul class="dd-list" role="listbox" tabindex="-1" hidden></ul>';
    this.btn = root.querySelector('.dd-btn'); this.list = root.querySelector('.dd-list');
    this.btn.addEventListener('click', function () { self.isOpen() ? self.close() : self.open(); });
    this.btn.addEventListener('keydown', function (e) {
      if (['ArrowDown', 'ArrowUp', 'Enter', ' '].indexOf(e.key) > -1) { e.preventDefault(); self.open(); }
    });
    this.list.addEventListener('keydown', function (e) { self.key(e); });
    this.list.addEventListener('mousemove', function (e) {
      var li = e.target.closest('.dd-opt'); if (li) self.setActive(+li.dataset.i, false);
    });
    this.list.addEventListener('click', function (e) {
      var li = e.target.closest('.dd-opt'); if (li) self.pick(+li.dataset.i);
    });
    document.addEventListener('mousedown', function (e) { if (self.isOpen() && !root.contains(e.target)) self.close(true); });
    dropdowns.push(this);
  }
  Dropdown.prototype.isOpen = function () { return !this.list.hidden; };
  Dropdown.prototype.render = function () {
    var items = this.opts.items(), val = this.opts.get(), cur = null, html = '', lastGroup = null, id = this.root.id;
    items.forEach(function (it, i) {
      if (it.group && it.group !== lastGroup) { html += '<li class="dd-group" role="presentation">' + esc(it.group) + '</li>'; lastGroup = it.group; }
      if (it.v === val) cur = it;
      html += '<li class="dd-opt" role="option" id="' + id + '-o' + i + '" data-i="' + i + '" aria-selected="' + (it.v === val) + '">' +
        it.icon + '<span class="t"><b>' + esc(it.label) + '</b>' + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>' +
        svg('check', 'tick') + '</li>';
    });
    this.list.innerHTML = html;
    var ph = this.opts.placeholder(), sub = cur ? (cur.btnSub || cur.sub) : '';
    this.btn.innerHTML = cur
      ? cur.icon + '<span class="dd-val"><b>' + esc(cur.label) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' + svg('chev', 'chev')
      : '<span class="oi ph">' + svg(this.opts.phIcon) + '</span><span class="dd-val ph"><b>' + esc(ph[0]) + '</b><small>' + esc(ph[1]) + '</small></span>' + svg('chev', 'chev');
  };
  Dropdown.prototype.open = function () {
    closeAll(this);
    this.render();
    this.list.hidden = false; this.root.classList.add('open'); this.btn.setAttribute('aria-expanded', 'true');
    var val = this.opts.get(), idx = 0;
    this.opts.items().forEach(function (it, i) { if (it.v === val) idx = i; });
    this.setActive(idx, true);
    this.list.focus({ preventScroll: true });
    this.list.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  Dropdown.prototype.close = function (silent) {
    this.list.hidden = true; this.root.classList.remove('open'); this.btn.setAttribute('aria-expanded', 'false');
    if (!silent) this.btn.focus();
  };
  Dropdown.prototype.setActive = function (i, scroll) {
    var prev = this.list.querySelector('.dd-opt.active'); if (prev) prev.classList.remove('active');
    var li = this.list.querySelector('[data-i="' + i + '"]'); if (!li) return;
    this.active = i; li.classList.add('active'); this.list.setAttribute('aria-activedescendant', li.id);
    if (scroll) li.scrollIntoView({ block: 'nearest' });
  };
  Dropdown.prototype.key = function (e) {
    var n = this.opts.items().length;
    if (e.key === 'ArrowDown') { e.preventDefault(); this.setActive(Math.min(n - 1, this.active + 1), true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this.setActive(Math.max(0, this.active - 1), true); }
    else if (e.key === 'Home') { e.preventDefault(); this.setActive(0, true); }
    else if (e.key === 'End') { e.preventDefault(); this.setActive(n - 1, true); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.pick(this.active); }
    else if (e.key === 'Escape') { e.preventDefault(); this.close(); }
    else if (e.key === 'Tab') { this.close(true); }
  };
  Dropdown.prototype.pick = function (i) {
    var it = this.opts.items()[i]; if (!it) return;
    this.opts.set(it.v); this.close(); this.render();
  };

  new Dropdown($('dd-sinf'), {
    labelId: 'sinf-lbl', phIcon: 'cap',
    placeholder: function () { return [t('gradePh'), t('gradePhSub')]; },
    items: function () {
      return GRADES.map(function (g) {
        var band = g === 1 ? ['g-p', t('gP')] : g <= 9 ? ['g-m', t('gM')] : ['g-h', t('gH')];
        return { v: g + '-sinf', label: t('grade')(g), btnSub: band[1], group: band[1], icon: '<span class="oi ' + band[0] + '">' + g + '</span>' };
      });
    },
    get: function () { return state.sinf; },
    set: function (v) { state.sinf = v; mark('sinf', false); }
  });
  new Dropdown($('dd-manba'), {
    labelId: 'manba-lbl', phIcon: 'mega',
    placeholder: function () { return [t('srcPh'), t('srcPhSub')]; },
    items: function () {
      return SOURCES.map(function (s) {
        return { v: s.v, label: s[lang], sub: SRC_SUB[lang][s.v] || '', icon: '<span class="oi ' + s.cls + '">' + svg(s.ic) + '</span>' };
      });
    },
    get: function () { return state.manba; },
    set: function (v) {
      state.manba = v; mark('manba', false);
      $('otherWrap').hidden = v !== 'Boshqa';
      if (v === 'Boshqa') setTimeout(function () { other.focus(); }, 0);
    }
  });

  // ---------- Sahifa ----------
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = T[lang][el.getAttribute('data-t')]; if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-ph')); });
    document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    var h = $('h1'), p = t('h1'); h.textContent = '';
    h.appendChild(document.createTextNode(p[0]));
    var em = document.createElement('em'); em.textContent = p[1]; h.appendChild(em);
    h.appendChild(document.createTextNode(p[2]));
    dropdowns.forEach(function (d) { d.render(); });
    renderStep();
  }

  function renderStep() {
    document.querySelectorAll('.step').forEach(function (s) { s.hidden = +s.dataset.step !== step; });
    $('stepOf').textContent = t('stepOf')(step);
    $('ptitle').textContent = t('titles')[step - 1];
    $('pct').textContent = t('pct')(step * 20);
    $('bar').style.width = (step * 20) + '%';
    $('back').style.visibility = step === 1 ? 'hidden' : 'visible';
    var last = step === 5;
    $('nextTxt').textContent = sending ? t('sending') : (last ? t('submit') : t('next') + t('short')[step]);
    $('nextIco').innerHTML = '<use href="#i-' + (last ? 'send' : 'right') + '"/>';
  }

  function mark(f, bad) {
    var el = form.querySelector('[data-f="' + f + '"]');
    el.classList.toggle('bad', bad);
    el.querySelector('.err').hidden = !bad;
    return bad;
  }

  function data() {
    var til = form.querySelector('input[name="til"]:checked');
    var manba = state.manba;
    if (manba === 'Boshqa') manba = other.value.trim() ? 'Boshqa: ' + other.value.trim() : '';
    return {
      ism: $('ism').value.trim(), familiya: $('familiya').value.trim(), sinf: state.sinf,
      til: til ? til.value : '', telefon: phone.value.replace(/\D/g, ''), manba: manba,
      hp: $('hp').value
    };
  }

  function check(n) {
    var d = data(), bad = false;
    if (n === 1) { var a = mark('ism', d.ism.length < 2), b = mark('familiya', d.familiya.length < 2); bad = a || b; }
    if (n === 2) bad = mark('sinf', !d.sinf);
    if (n === 3) bad = mark('til', !d.til);
    if (n === 4) bad = mark('telefon', d.telefon.length !== 9);
    if (n === 5) bad = mark('manba', !d.manba);
    if (bad) {
      var f = form.querySelector('.step:not([hidden]) .bad input[type="text"], .step:not([hidden]) .bad input[type="tel"], .step:not([hidden]) .bad .dd-btn');
      if (f) f.focus();
    }
    return !bad;
  }

  function go(n) {
    closeAll();
    step = n; $('serverErr').hidden = true; renderStep();
    var first = form.querySelector('.step[data-step="' + n + '"] input[type="text"], .step[data-step="' + n + '"] input[type="tel"]');
    if (first && window.innerWidth > 640) first.focus({ preventScroll: true });
  }

  function showDone(d) {
    $('flow').hidden = true; $('done').hidden = false;
    var rows = [
      [t('sName'), d.ism + ' ' + d.familiya],
      [t('sGrade'), t('grade')(parseInt(d.sinf, 10))],
      [t('sLang'), d.til === 'Rus' ? t('ruT') : t('uzT')],
      [t('sPhone'), '+998 ' + phone.value]
    ];
    var sum = $('sum'); sum.innerHTML = '';
    rows.forEach(function (r) {
      var w = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = r[0]; dd.textContent = r[1]; w.appendChild(dt); w.appendChild(dd); sum.appendChild(w);
    });
    $('done').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function send() {
    var d = data();
    sending = true; $('next').disabled = true; $('back').disabled = true; renderStep();
    var reset = function () { sending = false; $('next').disabled = false; $('back').disabled = false; renderStep(); };
    var ok = function () { reset(); showDone(d); };
    var fail = function (msg) { reset(); $('serverErr').textContent = t('eServer') + (msg ? ' (' + msg + ')' : ''); $('serverErr').hidden = false; };
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { fail(e && (e.message || String(e))); }).submitAdmission(d);
    } else if (API_URL && API_URL.indexOf('__') !== 0) {
      // Matn ko'rinishida yuboriladi, shunda brauzer Google'ga oldindan so'rov (CORS preflight) yubormaydi.
      fetch(API_URL, { method: 'POST', body: JSON.stringify(d) })
        .then(function (r) { return r.json(); })
        .then(function (res) { if (res && res.ok) ok(); else fail(res && res.error); })
        .catch(function (e) { fail(e && e.message); });
    } else {
      setTimeout(function () { ok(); $('demoNote').hidden = false; }, 700); // Namuna rejimi: Google Sheets ulanmagan.
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (sending || !check(step)) return;
    if (step < 5) go(step + 1); else send();
  });
  $('back').addEventListener('click', function () { if (step > 1) go(step - 1); });

  phone.addEventListener('input', function () {
    var d = phone.value.replace(/\D/g, '');
    if (d.length > 9 && d.indexOf('998') === 0) d = d.slice(3);
    d = d.slice(0, 9);
    phone.value = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(' ');
    if (d.length === 9) mark('telefon', false);
  });
  ['ism', 'familiya'].forEach(function (id) { $(id).addEventListener('input', function () { if ($(id).value.trim().length >= 2) mark(id, false); }); });
  form.querySelectorAll('input[name="til"]').forEach(function (r) { r.addEventListener('change', function () { mark('til', false); }); });
  other.addEventListener('input', function () { if (other.value.trim()) mark('manba', false); });

  document.querySelectorAll('.langs button').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.dataset.lang;
      try { localStorage.setItem('ois-lang', lang); } catch (e) {}
      render();
    });
  });

  $('again').addEventListener('click', function () {
    form.reset(); state.sinf = ''; state.manba = ''; $('otherWrap').hidden = true;
    form.querySelectorAll('.bad').forEach(function (el) { el.classList.remove('bad'); el.querySelector('.err').hidden = true; });
    $('done').hidden = true; $('flow').hidden = false; step = 1; render();
  });

  render();
})();
</script>
<script>
/* Telefonda bosqich sarlavhasini bir qatorga sig'dirish */
(function(){
  function fit(){
    document.querySelectorAll('.shead h3').forEach(function(h){
      h.style.fontSize='';
      if (window.innerWidth > 640 || !h.offsetParent) return;
      var fs=parseFloat(getComputedStyle(h).fontSize);
      while (h.scrollWidth > h.clientWidth && fs > 11) { fs -= 0.5; h.style.fontSize = fs + 'px'; }
    });
  }
  var f=document.getElementById('f');
  if (f) new MutationObserver(function(){ requestAnimationFrame(fit); }).observe(f,{subtree:true,attributes:true,attributeFilter:['hidden'],childList:true,characterData:true});
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  setTimeout(fit, 300);
})();
</script>

</body>
</html>
